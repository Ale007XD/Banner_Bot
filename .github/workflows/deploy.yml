name: Deploy Telegram Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Шаг: Скачиваем исходный код репозитория на виртуальную машину Actions
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Шаг: Безопасно создаем .env файл на виртуальной машине Actions
      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
      
      # 3. Шаг: Копируем все файлы на VPS
      # Используем другой готовый экшен, который отлично подходит для этого - scp
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "."  # Копируем всё из текущей директории (.)
          target: "~/banner_bot" # В какую папку на сервере копировать
          
      # 4. Шаг: Подключаемся к VPS и запускаем Docker
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Переходим в директорию проекта
            cd ~/banner_bot
            
            # Сначала останавливаем и удаляем старые контейнеры, чтобы избежать ошибок состояния
            docker-compose down
            
            # Пересобираем и перезапускаем Docker Compose
            docker-compose up --build -d
