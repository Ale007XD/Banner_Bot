name: Deploy Telegram Bot to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Выберите ветку для деплоя'
        required: true
        default: 'main'
        type: choice
        options:
        - main
        - refactor
        - develop
        - hot-refactor
  push:
    branches: [ main, refactor ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код из выбранной ветки
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # 2. Создаем .env файл
      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}" >> .env
      
      # 3. Копируем файлы проекта на VPS
      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "src,fonts,.env,Dockerfile,docker-compose.yml,requirements.txt"
          target: "~/banner_bot" 
          
      # 4. Подключаемся к VPS и перезапускаем Docker
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/banner_bot
            git fetch origin
            git checkout ${{ github.event.inputs.branch || github.ref_name }}
            git pull origin ${{ github.event.inputs.branch || github.ref_name }}
            docker compose down
            docker compose up --build -d
