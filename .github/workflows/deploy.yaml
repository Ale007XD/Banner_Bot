name: Deploy Telegram Bot to VPS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "ОШИБКА: TELEGRAM_BOT_TOKEN не задан"
            exit 1
          fi
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}" >> .env

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "src,fonts,assets,Dockerfile,docker-compose.yml,requirements.txt,.env"
          target: "~/banner_bot"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/banner_bot

            # Создаём необходимые директории
            mkdir -p orders bot_data

            # Инициализируем счётчик если его нет
            [ -f order_counter.json ] || \
              echo '{"total_ever": 0, "daily": {}}' > order_counter.json

            # Сбрасываем Webhook — исключаем перехват апдейтов
            # (актуально если ранее был настроен Webhook)
            curl -s "https://api.telegram.org/bot$(grep TELEGRAM_BOT_TOKEN .env \
              | cut -d= -f2)/deleteWebhook?drop_pending_updates=true" | \
              python3 -c "import sys,json; \
              r=json.load(sys.stdin); \
              print('Webhook сброшен:', r.get('result'))"

            # Останавливаем контейнер
            docker compose down

            # Удаляем старый образ — гарантируем чистую сборку
            docker rmi banner_bot-telegram-bot 2>/dev/null || true
            docker image prune -f

            # Собираем без кэша и запускаем
            docker compose build --no-cache
            docker compose up -d

            echo "Деплой завершён"
            echo "Логи (последние 20 строк):"
            sleep 3 && docker compose logs --tail=20
