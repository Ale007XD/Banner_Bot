services:
  telegram-bot:
    build: .
    container_name: pdf_banner_bot
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Персистентное хранение заказов и счётчика между перезапусками
      - ./orders:/app/orders
      - ./order_counter.json:/app/order_counter.json
