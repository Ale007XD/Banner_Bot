name: Deploy Telegram Bot to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка для деплоя'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}" >> .env

      # Копируем исходники на VPS через SCP
      # Примечание: используем только SCP (без git pull на сервере).
      # Это единственный источник истины при деплое.
      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "src,fonts,.env,Dockerfile,docker-compose.yml,requirements.txt"
          target: "~/banner_bot"

      - name: Restart Docker container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/banner_bot
            # Убеждаемся, что папка для заказов существует (volume)
            mkdir -p orders
            # Создаём пустой счётчик если его нет
            [ -f order_counter.json ] || echo '{"total_ever": 0, "daily": {}}' > order_counter.json
            docker compose down
            docker compose up --build -d
            echo "✅ Деплой завершён"
            
